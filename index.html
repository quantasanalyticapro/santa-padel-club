.turno-row.done{opacity:.55}
.order-board .fecha>h4{margin:16px 0 4px;color:#f1d982;font-size:15px;text-transform:capitalize}
.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.order-actions .w{flex:1;min-width:150px}
/* Cruces: avatares arriba, nombres abajo */
body .match-side{flex-direction:column;align-items:center;gap:6px;text-align:center}
body .match-side-name{text-align:center;overflow-wrap:anywhere}
body .match-teams{align-items:start}
body .match-versus{align-self:start;margin-top:15px}
body .datos-link{display:inline;background:none;border:0;min-height:0;padding:0;margin-left:8px;color:#e4cb79;font-size:11px;text-decoration:underline;cursor:pointer}
.pair-warn{margin-top:4px;font-size:11px;color:#f0a35e}
/* Marcador nuevo */
body .sb2{background:#0a243a;border:1px solid #806d3e;border-radius:16px;padding:10px 12px;margin:8px 0}
body .sb2-top{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.8px;color:#9fb1ba;padding:0 0 6px}
body .sb2-h,body .sb2-r{display:grid;grid-template-columns:1fr 46px 62px;gap:8px;align-items:center}
body .sb2-h{font-size:10px;letter-spacing:.8px;color:#9fb1ba;text-align:center}
body .sb2-r{padding:9px 0 9px 10px;border-top:1px solid #ffffff14;border-left:5px solid var(--c);border-radius:2px}
body .sb2-r.flash{animation:sb2fl .9s ease}
@keyframes sb2fl{0%{background:#e4cb7966}100%{background:transparent}}
body .sb2-who{display:flex;align-items:center;gap:10px;min-width:0}
body .sb2-r .scoring-avatars{margin:0;justify-content:flex-start;flex:none}
body .sb2-r .scoring-avatar{width:40px;height:40px;margin-left:-10px}
body .sb2-r .scoring-avatar:first-child{margin-left:0}
body .sb2-n{font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere}
body .sb2-g,body .sb2-p{text-align:center;font-weight:800}
body .sb2-g{font-size:30px}body .sb2-p{font-size:26px;color:#e4cb79}
body .sc2-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
body .sc2-col{display:flex;flex-direction:column;gap:8px}
body .sc2-A{--c:#7fb3d5}body .sc2-B{--c:#e4cb79}
body .sc2-main{min-height:96px;border-radius:16px;border:2px solid var(--c);background:#0f3150;color:#f4efe0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px}
body .sc2-main small{font-size:10px;letter-spacing:.9px;color:var(--c);font-weight:800}
body .sc2-main b{font-size:17px;line-height:1.15;text-align:center}
body .sc2-two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
body .sc2-two button{min-height:52px;border-radius:14px;border:1px solid var(--c);background:transparent;font-weight:800;font-size:17px;color:var(--c)}
body .sc2-main:disabled,body .sc2-two button:disabled{opacity:.4}
body .stake{display:block;margin-top:3px;font-size:11px;font-weight:700;color:#9fb1ba}
body .stake .up{color:#8fd19e}body .stake .dn{color:#f08a7e}
/* Marcador por avatar */
body .sc3-card{position:relative;border:2px solid var(--c);border-radius:20px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 14%,#0a243a),#0a243a);padding:12px 14px 14px;margin:10px 0}
body .sc3-A{--c:#7fb3d5}body .sc3-B{--c:#e4cb79}
body .sc3-card.flash{animation:sc3fl .8s ease}
@keyframes sc3fl{0%{box-shadow:0 0 0 0 var(--c),inset 0 0 40px #ffffff33}100%{box-shadow:0 0 0 14px transparent}}
body .sc3-hd{display:flex;justify-content:space-between;align-items:flex-start}
body .sc3-tn{font-weight:800;font-size:17px;color:var(--c)}
body .sc3-pts{font-size:64px;font-weight:900;line-height:.95;color:var(--c)}
body .sc3-gm{margin-top:8px}body .sc3-gm small{display:block;font-size:10px;letter-spacing:.9px;color:#9fb1ba}body .sc3-gm b{font-size:30px}
body .sc3-avs{display:flex;justify-content:space-around;margin-top:10px}
body .sc3-pl{display:flex;flex-direction:column;align-items:center;gap:6px;width:46%}
body .sc3-av{width:74px;height:74px;border-radius:50%;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;cursor:pointer}
body .sc3-av .av{width:74px;height:74px;margin:0;font-size:22px;border:3px solid var(--c)}
body .sc3-av.srv{box-shadow:0 0 0 4px #ffffff22,0 0 22px var(--c)}
body .sc3-pl b{font-size:15px}body .sc3-pl em{font-style:normal;font-size:10px;font-weight:800;letter-spacing:1px;color:var(--c);min-height:12px}
#sc3menu{position:fixed;left:0;top:0;width:0;height:0;z-index:80}#sc3menu[hidden]{display:none}
.sc3-dim{position:fixed;inset:0;background:#00000066}
.sc3-bub{position:absolute;display:flex;flex-direction:column;align-items:center;gap:4px;transform:translate(-50%,-50%);cursor:pointer;touch-action:none}
.sc3-bub i{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:26px;font-weight:900;color:#06243d;background:var(--k);border:3px solid transparent}
.sc3-bub span{font-size:12px;font-weight:800;background:#000a;border-radius:999px;padding:2px 9px;color:var(--k)}
.sc3-bub.on i{border-color:#fff;transform:scale(1.18)}
/* Pantalla de marcador (tablet) */
body .sc3-qr{margin-left:auto;font-size:13px;padding:6px 10px;min-height:0;border:1px solid #806d3e;border-radius:10px;background:none;color:#e4cb79}
.qrbox svg{width:min(70vw,300px);height:auto;background:#fff;padding:8px;border-radius:12px}
body.pantalla{background:#000;color:#fff;padding:0;margin:0}
body.pantalla #app{max-width:none!important;width:100%!important;margin:0!important;padding:0!important}
body.pantalla .pt-top{flex-wrap:wrap;align-items:center}body.pantalla .pt-live,body.pantalla .pt-back{white-space:nowrap}body.pantalla .pt-top>span:last-child{margin-left:auto;text-align:right}
.pt-wrap{min-height:100vh;display:flex;flex-direction:column;padding:2vh 3vw;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.pt-top{display:flex;justify-content:space-between;gap:12px;font-weight:800;letter-spacing:.1em;font-size:clamp(14px,2.2vw,28px);color:#9fb1ba}
.pt-live{color:#ff6b6b}
.pt-main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3vw;align-items:center}
.pt-team{text-align:center}.pt-A{--c:#7fb3d5}.pt-B{--c:#e4cb79}
.pt-name{display:flex;justify-content:center;align-items:center;gap:.4em;font-size:clamp(20px,3.6vw,60px);font-weight:800;color:var(--c)}
.pt-pts{font-size:clamp(80px,24vw,400px);font-weight:900;line-height:1;color:var(--c)}
.pt-gm small{display:block;font-size:clamp(12px,1.8vw,26px);letter-spacing:.15em;color:#9fb1ba}.pt-gm b{font-size:clamp(40px,8vw,140px)}
.pt-dot{width:.45em;height:.45em;border-radius:50%;background:#b6f23a;display:inline-block}
.pt-srv,.pt-fin{text-align:center;font-size:clamp(16px,2.6vw,36px);color:#9fb1ba;padding:1vh 0}.pt-fin{color:#e4cb79;font-weight:800}
.pt-msg{margin:auto;font-size:28px;color:#9fb1ba}
body .hist{margin:18px 0 8px}body .hist h3{font-size:12px;letter-spacing:.8px;color:#e4cb79;margin:0 0 8px}body .hist h4{margin:10px 0 6px;font-size:14px}
body .hist ul{list-style:none;margin:0;padding:0}body .hist li{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #ffffff14;font-size:14px}body .hist li span{flex:1}body .hist li b{color:#e4cb79;white-space:nowrap}
body .hd-dot{width:10px;height:10px;border-radius:50%;flex:none}body .hd-A{background:#7fb3d5}body .hd-B{background:#e4cb79}
body .hist details{margin-top:8px;border:1px solid #ffffff22;border-radius:12px;padding:8px 12px}body .hist summary{cursor:pointer;font-weight:700;font-size:13px;color:#9fb1ba}
body .pt-back{background:none;border:1px solid #806d3e;border-radius:12px;color:#e4cb79;padding:6px 14px;font-size:clamp(14px,2vw,22px);min-height:0;cursor:pointer}
body .ver-mini{width:100%;margin-top:6px;padding:6px;font-size:12px;min-height:0;border:1px solid #806d3e;border-radius:10px;background:none;color:#e4cb79}

/* Tema Santa: azul noche + dorado */
body.welcome{background:#030a15 var(--court) center top/cover no-repeat fixed;color:#f5f2e9}
body.welcome main{min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 18px 28px;background:none}
.lg-top{position:absolute;left:-40%;top:6%;width:120%;height:3px;background:linear-gradient(90deg,transparent,#e6c76a,transparent);transform:rotate(-28deg);box-shadow:0 0 12px #c9a24b}
.lg-brand{text-align:center;padding-top:9vh;position:relative}.lg-brand svg{filter:drop-shadow(0 4px 12px #000)}
.lg-santa{font:900 66px/1 Georgia,serif;letter-spacing:.03em;background:linear-gradient(180deg,#fff3c0,#d9b25a 55%,#8e6a24);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 8px #000a)}
.lg-sub{display:flex;align-items:center;gap:10px;justify-content:center;color:#e6c76a;font:800 19px system-ui;letter-spacing:.3em;margin-top:4px}.lg-sub i{flex:1;max-width:60px;height:2px;background:linear-gradient(90deg,transparent,#e6c76a)}.lg-sub i:last-child{transform:scaleX(-1)}
.lg-tag{color:#d5dce6;font:600 12px system-ui;letter-spacing:.3em;margin-top:14px}
.lg-ball{position:relative;width:96px;height:96px;margin:26px 0 -34px auto;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3f06a,#c4c52c 55%,#7d8014);box-shadow:inset -8px -10px 18px #4a4d0a99,0 10px 24px #000c}
.lg-ball:after{content:"";position:absolute;inset:8px -20px 8px 30px;border:3px solid #f4f4c8aa;border-radius:50%;clip-path:inset(0 55% 0 0)}
body.welcome .lg-card{position:relative;background:#050d1c40;border:1px solid #c9a24b;border-radius:24px;padding:14px;margin:0;box-shadow:0 14px 40px #0008;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.fi{display:flex;align-items:center;gap:10px;margin:9px 0;padding:0 12px;border:1px solid #b69b53;border-radius:14px;background:#050d1c59;position:relative}

{const OPT=[['w','Ganador','#8fd19e','↑'],['pr','Presión','#e8b34f','→'],['e','Error','#e06a55','✕']];let hold=null,mn=null;
